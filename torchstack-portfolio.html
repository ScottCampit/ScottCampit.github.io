<\!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torchstack Portfolio</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #3478F6; --blue-dark: #2558C5; --blue-light: #E8F0FE;
    --dark: #1A1A2E; --dark-card: #16213E; --dark-accent: #0F3460;
    --white: #FFFFFF; --off-white: #F8F9FC;
    --gray: #6B7280; --gray-light: #E5E7EB;
    --text: #1F2937; --text-light: #9CA3AF;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--off-white); color: var(--text); line-height: 1.5;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Nav */
  .nav { background: var(--white); border-bottom: 1px solid var(--gray-light); padding: 0 48px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .nav-brand { display: flex; align-items: center; gap: 10px; }
  .nav-brand span { font-size: 20px; font-weight: 700; color: var(--blue); letter-spacing: -0.02em; }
  .nav-tagline { font-size: 13px; color: var(--text-light); font-style: italic; }

  /* Hero */
  .hero { background: linear-gradient(135deg, var(--dark) 0%, var(--dark-accent) 50%, var(--dark-card) 100%); padding: 72px 48px 64px; position: relative; overflow: hidden; }
  .hero-glow1 { position: absolute; top: 10%; right: 5%; width: 320px; height: 320px; border-radius: 50%; background: rgba(52,120,246,0.03); filter: blur(60px); }
  .hero-glow2 { position: absolute; bottom: -20%; left: 10%; width: 250px; height: 250px; border-radius: 50%; background: rgba(52,120,246,0.025); filter: blur(40px); }
  .hero-content { position: relative; max-width: 800px; }
  .hero-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--blue); margin-bottom: 16px; }
  .hero h1 { font-size: 44px; font-weight: 800; color: var(--white); line-height: 1.15; margin-bottom: 20px; letter-spacing: -0.02em; }
  .hero h1 span { color: var(--blue); }
  .hero-desc { font-size: 18px; color: #94A3B8; line-height: 1.6; max-width: 600px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 48px; max-width: 720px; }
  .stat { text-align: center; padding: 20px 12px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); animation: fadeIn 0.6s ease both; }
  .stat-num { font-size: 28px; font-weight: 800; color: var(--white); }
  .stat-label { font-size: 12px; color: #64748B; margin-top: 4px; }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
  .filter-btn { padding: 8px 18px; border-radius: 10px; border: 1px solid var(--gray-light); background: var(--white); color: var(--gray); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .filter-btn.active { border: 2px solid var(--blue); background: var(--blue-light); color: var(--blue); font-weight: 700; }

  /* Cards Grid */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
  .card { background: var(--white); border-radius: 16px; border: 1px solid var(--gray-light); overflow: hidden; cursor: pointer; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); animation: fadeIn 0.5s ease both; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
  .card-hero { height: 160px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #F1F5F9; }
  .card-hero img { width: 100%; height: 100%; object-fit: cover; }
  .card-bar { height: 6px; }
  .card-body { padding: 20px 24px 22px; }
  .card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card-icon { font-size: 24px; }
  .card-cat { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 10px; border-radius: 6px; }
  .card h3 { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 8px; line-height: 1.3; }
  .card p { font-size: 13px; color: var(--gray); line-height: 1.6; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 14px; }
  .card-tag { font-size: 10px; color: var(--gray); background: var(--off-white); padding: 3px 7px; border-radius: 4px; border: 1px solid var(--gray-light); }
  .card-cta { margin-top: 16px; font-size: 13px; font-weight: 600; color: var(--blue); }

  /* Case Study */
  .case-study { animation: fadeIn 0.4s ease; }
  .back-btn { background: none; border: none; color: var(--blue); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 0 0 24px; }
  .cs-wrap { background: var(--white); border-radius: 20px; overflow: hidden; border: 1px solid var(--gray-light); }
  .cs-header { padding: 48px 48px 40px; position: relative; overflow: hidden; }
  .cs-header .circle1 { position: absolute; top: -40px; right: -40px; width: 200px; height: 200px; border-radius: 50%; }
  .cs-header .circle2 { position: absolute; bottom: -60px; right: 100px; width: 160px; height: 160px; border-radius: 50%; }
  .cs-header-inner { position: relative; }
  .cs-header h1 { font-size: 32px; font-weight: 800; color: var(--white); margin: 0 0 8px; line-height: 1.2; }
  .cs-header .subtitle { font-size: 18px; color: #CBD5E1; max-width: 640px; line-height: 1.5; }
  .cs-body { padding: 40px 48px 48px; }
  .section { margin-bottom: 40px; }
  .section-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
  .section p { font-size: 16px; color: var(--text); line-height: 1.7; }
  .deliverable { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: var(--off-white); border-radius: 10px; border: 1px solid var(--gray-light); margin-bottom: 12px; }
  .deliverable-num { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
  .deliverable p { font-size: 15px; color: var(--text); line-height: 1.6; }
  .tech-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tech-tag { font-size: 13px; font-weight: 500; color: var(--dark); padding: 6px 14px; border-radius: 8px; }

  /* Image Gallery */
  .gallery { margin-bottom: 40px; }
  .gallery-frame { background: #F1F5F9; border-radius: 14px; padding: 16px; border: 1px solid var(--gray-light); }
  .gallery-img-wrap { border-radius: 10px; overflow: hidden; background: var(--white); display: flex; justify-content: center; align-items: center; min-height: 200px; }
  .gallery-img-wrap img { max-width: 100%; max-height: 420px; object-fit: contain; display: block; }
  .gallery-label { font-size: 13px; color: var(--gray); text-align: center; margin-top: 12px; font-style: italic; }
  .gallery-dots { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
  .gallery-dot { width: 10px; height: 10px; border-radius: 50%; border: none; cursor: pointer; transition: all 0.2s; }

  /* Footer */
  .footer { background: var(--dark); padding: 40px 48px; display: flex; align-items: center; justify-content: space-between; }
  .footer-brand { display: flex; align-items: center; gap: 10px; }
  .footer-brand span { font-size: 16px; font-weight: 700; color: var(--white); }
  .footer p { font-size: 13px; color: #64748B; }

  .main { max-width: 1120px; margin: 0 auto; padding: 48px 32px 80px; }

  @media (max-width: 768px) {
    .hero { padding: 48px 24px 40px; }
    .hero h1 { font-size: 28px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .nav { padding: 0 24px; }
    .cs-header { padding: 32px 24px; }
    .cs-body { padding: 28px 24px 36px; }
    .main { padding: 32px 16px 60px; }
    .footer { padding: 32px 24px; flex-direction: column; gap: 16px; text-align: center; }
  }
</style>
</head>

    if (p.images && p.images.length > 0) {
      html += `<div class="gallery">
        <div class="section-label" style="color:${p.color};margin-bottom:16px">Visual Evidence</div>
        <div class="gallery-frame">
          <div class="gallery-img-wrap"><img src="${p.images[gi].src}" alt="${p.images[gi].label}"></div>
          <p class="gallery-label">${p.images[gi].label}</p>
          ${p.images.length > 1 ? `<div class="gallery-dots">${p.images.map((_,i) =>
            `<button class="gallery-dot" style="background:${i===gi?p.color:'var(--gray-light)'}" onclick="setGallery(${i})"></button>`
          ).join("")}</div>` : ""}
        </div>
      </div>`;
    }

    html += `<div class="section">
            <div class="section-label" style="color:${p.color};margin-bottom:16px">What We Delivered</div>
            ${p.deliverables.map((d,i) => `<div class="deliverable">
              <div class="deliverable-num" style="background:${p.color}18;color:${p.color}">${i+1}</div>
              <p>${d}</p>
            </div>`).join("")}
          </div>
          <div class="section">
            <div class="section-label" style="color:${p.color}">Technologies & Methods</div>
            <div class="tech-tags">${p.techTags.map(t =>
              `<span class="tech-tag" style="background:${p.color}12;border:1px solid ${p.color}30">${t}</span>`
            ).join("")}</div>
          </div>
        </div>
      </div>
    </div></main>`;
  }

  html += `<footer class="footer">
    <div class="footer-brand">${torch(24)}<span>Torchstack</span></div>
    <p>Ready to build? Let's talk about your project.</p>
  </footer>`;

  app.innerHTML = html;
}

function setFilter(f) { state.filter = f; state.view = "grid"; render(); }
function openProject(id) { state.project = PROJECTS.find(p => p.id === id); state.view = "detail"; state.galleryIdx = 0; window.scrollTo({top:0,behavior:"smooth"}); render(); }
function goBack() { state.view = "grid"; state.project = null; render(); }
function setGallery(i) { state.galleryIdx = i; render(); }

render();
</script>
</body>
</html>
