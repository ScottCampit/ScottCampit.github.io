title: Scott E. Campit, PhD
tagline: Research Scientist at Toby · Founder · AI Engineer
description: >-
  Scott E. Campit, PhD, is a computational biologist and Research Scientist at Toby,
  building AI-based non-invasive diagnostics for early detection of cancer, Alzheimer's,
  and other diseases. Based in Austin, TX.
url: https://scottcampit.com
lang: en_US
email: scottcampit@gmail.com

author:
  name: Scott E. Campit, PhD
  url: https://scottcampit.com
social:
  name: Scott E. Campit, PhD
  links:
    - https://github.com/ScottCampit
    - https://www.linkedin.com/in/scottcampit/

collections:
  case_studies:
    output: true
    permalink: /case-studies/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /images/profile.jpg
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case-study
      # First published on the site; without this Jekyll stamps every build time.
      date: "2026-04-10"
      seo:
        type: Article

theme: null

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/
