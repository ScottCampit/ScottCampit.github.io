title: Scott Campit
tagline: Research Scientist at Toby · Founder · AI Engineer
description: >-
  Scott Campit builds AI that turns biological and clinical data into clear decisions
  that improve health outcomes. Research Scientist at Toby, former founder of Torchstack,
  based in Austin, TX.
url: https://scottcampit.com
lang: en_US
email: scottcampit@gmail.com

author:
  name: Scott Campit
  url: https://scottcampit.com
social:
  name: Scott Campit
  links:
    - https://github.com/ScottCampit
    - https://www.linkedin.com/in/scottcampit/

collections:
  case_studies:
    output: true
    permalink: /case-studies/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /images/profile.jpg
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case-study
      # First published on the site; without this Jekyll stamps every build time.
      date: "2026-04-10"
      seo:
        type: Article

theme: null

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/
