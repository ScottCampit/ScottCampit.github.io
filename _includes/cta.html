<section class="cta{% if include.boxed %} cta-boxed{% endif %}">
  <h2 class="cta-heading">{{ include.heading | default: "Let&rsquo;s talk" }}</h2>
  {% if include.text %}<p class="cta-text">{{ include.text }}</p>{% endif %}
  <div class="cta-actions">
    <a class="btn-primary" href="mailto:{{ site.email }}">{{ include.button | default: "Email me" }}</a>
    <span class="cta-email">{{ site.email }}</span>
  </div>
</section>
