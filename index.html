<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott Campit</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #D6DAE2;
    --text: #435272;
    --text-light: #5B6B8A;
    --accent: #DB8749;
    --link: #5A7FA0;
    --card-bg: #FFFFFF;
    --border: #CBD5E1;
    --icon-border: #9EAABB;
    --heading-font: 'Bricolage Grotesque', sans-serif;
    --body-font: 'Sora', sans-serif;
    --mono-font: 'IBM Plex Mono', monospace;
  }

  body {
    font-family: var(--body-font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ============ HOME PAGE ============ */

  .home-layout {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 40px 0;
    flex: 1;
    width: 100%;
    display: flex;
    gap: 48px;
  }
  .home-left {
    flex: 1;
    max-width: 560px;
  }
  .home-right {
    width: 380px;
    flex-shrink: 0;
    padding-top: 80px;
  }

  /* Nav */
  nav {
    margin-bottom: 32px;
  }
  nav a, nav span {
    font-family: var(--body-font);
    font-size: 15px;
    text-decoration: none;
    color: var(--text);
  }
  nav a {
    color: var(--link);
    text-decoration: none;
    font-weight: 400;
  }
  nav a:hover { opacity: 0.8; }
  nav .separator {
    margin: 0 6px;
    color: var(--text-light);
    font-weight: 400;
  }
  nav .active {
    color: var(--text);
    text-decoration: none;
    cursor: default;
    font-weight: 600;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--accent);
  }

  /* Labels */
  .labels {
    font-family: var(--mono-font);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 20px;
  }

  /* Hero */
  .hero-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }
  .profile-photo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .hero-header h1 {
    font-family: var(--heading-font);
    font-size: 44px;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.1;
  }

  /* Bio */
  .bio {
    font-family: var(--body-font);
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
    margin-bottom: 36px;
  }

  /* Get in touch */
  .cta-heading {
    font-family: var(--heading-font);
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-underline-offset: 5px;
    text-decoration-thickness: 2px;
    display: inline-block;
    margin-bottom: 24px;
  }

  /* Social Icons */
  .social-icons {
    display: flex;
    gap: 14px;
    margin-bottom: 40px;
  }
  .social-icon {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    border: 1.5px solid var(--icon-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-light);
    text-decoration: none;
    transition: all 0.2s;
    background: transparent;
  }
  .social-icon:hover {
    border-color: var(--text);
    color: var(--text);
  }
  .social-icon svg {
    width: 22px;
    height: 22px;
  }

  /* Calendly Embed */
  .calendly-inline-widget {
    border-radius: 16px;
    overflow: hidden;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 32px 24px;
    font-family: var(--body-font);
    font-size: 13px;
    color: var(--text-light);
  }
  footer a {
    color: var(--accent);
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }

  /* ============ CASE STUDIES PAGE ============ */

  .cs-page-wrapper {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 40px 48px;
    flex: 1;
    width: 100%;
  }

  .cs-brand {
    font-family: var(--heading-font);
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 32px;
    letter-spacing: -0.01em;
  }

  .cs-intro {
    font-family: var(--body-font);
    font-size: 15px;
    color: var(--text-light);
    margin-bottom: 36px;
    line-height: 1.6;
  }

  .cs-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  .cs-card {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s ease;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
  }
  .cs-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 36px rgba(67,82,114,0.12);
  }

  .cs-card-image {
    height: 140px;
    background: linear-gradient(135deg, #6B8CAE 0%, #435272 50%, #8A9BB5 100%);
    border-radius: 12px;
    margin: 10px 10px 0;
  }

  .cs-card-body {
    padding: 16px 18px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .cs-card-category {
    display: inline-block;
    font-family: var(--mono-font);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 6px;
    background: #E7F2F1;
    color: var(--text);
    margin-bottom: 10px;
    align-self: flex-start;
  }

  .cs-card h3 {
    font-family: var(--heading-font);
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text);
    line-height: 1.25;
  }
  .cs-card .summary {
    font-family: var(--body-font);
    font-size: 13px;
    color: var(--text-light);
    line-height: 1.55;
  }

  /* ============ CASE STUDY MODAL ============ */

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(67,82,114,0.55);
    backdrop-filter: blur(4px);
    z-index: 9998;
    cursor: pointer;
    animation: fadeInBackdrop 0.25s ease;
  }
  .modal-panel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(660px, 90vw);
    max-height: 90vh;
    background: #FFFFFF;
    z-index: 9999;
    animation: slideInPanel 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 24px 80px rgba(67,82,114,0.25);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    flex-shrink: 0;
    background: linear-gradient(135deg, #435272 0%, #2d3a52 100%);
    padding: 44px 44px 40px;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    cursor: pointer;
    color: #FFFFFF;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--body-font);
    transition: background 0.2s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.2); }
  .modal-header .cat-badge {
    display: inline-block;
    font-family: var(--mono-font);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #435272;
    background: #E7F2F1;
    border-radius: 6px;
    padding: 4px 10px;
    margin-bottom: 16px;
  }
  .modal-header h1 {
    font-family: var(--heading-font);
    font-size: 28px;
    font-weight: 800;
    color: #FFFFFF;
    margin: 0 0 10px;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  .modal-header .subtitle {
    font-family: var(--body-font);
    font-size: 15px;
    color: rgba(255,255,255,0.65);
    margin: 0;
    line-height: 1.6;
  }
  .modal-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 40px 44px 56px;
    background: #F5F7F9;
  }
  .modal-body::-webkit-scrollbar { display: none; }
  .modal-body { -ms-overflow-style: none; scrollbar-width: none; }

  .modal-section { margin-bottom: 32px; }
  .modal-section-label {
    font-family: var(--mono-font);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .modal-section p {
    font-family: var(--body-font);
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-light);
    margin: 0;
  }
  .modal-divider {
    height: 1px;
    background: #E2E8EF;
    margin: 0 0 32px;
  }

  .modal-deliverable {
    display: flex;
    gap: 14px;
    margin-bottom: 12px;
    align-items: flex-start;
    background: #FFFFFF;
    border: 1px solid #E2E8EF;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .modal-deliverable-num {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(219,135,73,0.12);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    font-family: var(--mono-font);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-deliverable p {
    font-family: var(--body-font);
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    margin: 0;
  }
  .modal-tech-tag {
    font-family: var(--mono-font);
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    background: #FFFFFF;
    border: 1px solid #CBD5E1;
    border-radius: 6px;
    padding: 6px 12px;
    display: inline-block;
    margin: 0 8px 8px 0;
  }

  /* Gallery in modal */
  .modal-gallery {
    background: #EAEEF3;
    border-radius: 14px;
    padding: 16px;
    border: 1px solid #E2E8EF;
    margin-bottom: 32px;
  }
  .modal-gallery-img {
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 180px;
  }
  .modal-gallery-img img {
    max-width: 100%;
    max-height: 380px;
    object-fit: contain;
    display: block;
  }
  .modal-gallery-label {
    font-size: 13px;
    color: var(--text-light);
    text-align: center;
    margin-top: 10px;
    font-style: italic;
  }
  .modal-gallery-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
  }
  .modal-gallery-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: var(--accent);
    opacity: 0.25;
    transition: opacity 0.2s;
  }
  .modal-gallery-dot.active { opacity: 1; }

  @keyframes fadeInBackdrop {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideInPanel {
    from { transform: translate(-50%, -50%) scale(0.96); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.4s ease both; }

  /* Responsive */
  @media (max-width: 900px) {
    .home-layout { flex-direction: column; padding: 32px 24px 0; }
    .home-left { max-width: 100%; }
    .home-right { width: 100%; padding-top: 0; }
    .cs-grid { grid-template-columns: repeat(2, 1fr); }
    .cs-page-wrapper { padding: 32px 24px; }
  }
  @media (max-width: 560px) {
    .cs-grid { grid-template-columns: 1fr; }
    .hero-header h1 { font-size: 32px; }
    .profile-photo { width: 68px; height: 68px; }
    .modal-header { padding: 28px 24px; }
    .modal-body { padding: 28px 24px 40px; }
  }
</style>
</head>

function render() {
  const app = document.getElementById("app");
  let html = "";
  if (state.page === "home") {
    html = renderHome();
  } else if (state.page === "case-studies") {
    html = renderCaseStudies();
  }
  if (state.modal) {
    html += renderModal();
  }
  app.innerHTML = html;
}

function renderNav(activePage) {
  const homeLink = activePage === "home"
    ? '<span class="active">home</span>'
    : '<a href="#" onclick="navigate(\'home\');return false;">home</a>';
  const csLink = activePage === "case-studies"
    ? '<span class="active">case studies</span>'
    : '<a href="#" onclick="navigate(\'case-studies\');return false;">case studies</a>';
  return '<nav>' + homeLink + '<span class="separator">&middot;</span>' + csLink + '</nav>';
}

          <img src="images/profile.png" alt="Scott Campit" class="profile-photo">\

        <div class="cta-heading">Get in touch</div>\

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="3" ry="3"/><line x1="8" y1="11" x2="8" y2="17"/><line x1="8" y1="8" x2="8.01" y2="8"/><path d="M12 17v-3.5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5V17" stroke-linecap="round" stroke-linejoin="round"/></svg>\

          </a>\

      </div>\
      <div class="home-right">\
        <div class="calendly-inline-widget" data-url="https://calendly.com/torchstack/discovery?hide_event_type_details=1&hide_gdpr_banner=1" style="min-width:320px;height:480px;"></div>\

function renderCaseStudies() {
  var cards = PROJECTS.map(function(p) {
    return '\
    <div class="cs-card" onclick="openModal(\'' + p.id + '\')">\
      <div class="cs-card-image"></div>\
      <div class="cs-card-body">\
        <span class="cs-card-category">' + p.category + '</span>\
        <h3>' + p.title + '</h3>\
        <div class="summary">' + p.summary + '</div>\
      </div>\
    </div>';
  }).join("");

  return '\
    <div class="cs-page-wrapper fade-in">\
      <div class="cs-brand">Scott Campit</div>\
      ' + renderNav("case-studies") + '\
      <p class="cs-intro">A collection of projects spanning AI/ML, product engineering, and research. Click any project to explore the details.</p>\
      <div class="cs-grid">' + cards + '</div>\
    </div>\
    <footer>&copy; 2026 &middot; Built with curiosity &amp; too much coffee &middot; A <a href="https://www.amyinsvg.com" target="_blank" rel="noopener">Chunky Melon Design</a> project</footer>\
  ';
}

function renderModal() {
  var p = state.modal;
  if (!p) return "";

  var deliverables = p.deliverables.map(function(d, i) {
    return '<div class="modal-deliverable"><div class="modal-deliverable-num">' + (i+1) + '</div><p>' + d + '</p></div>';
  }).join("");

  var techTags = p.techTags.map(function(t) {
    return '<span class="modal-tech-tag">' + t + '</span>';
  }).join("");

  var galleryHtml = "";
  if (p.images && p.images.length > 0) {
    var img = p.images[state.galleryIdx];
    var dots = p.images.map(function(_, i) {
      return '<button class="modal-gallery-dot ' + (i === state.galleryIdx ? 'active' : '') + '" onclick="event.stopPropagation();setGallery(' + i + ')"></button>';
    }).join("");
    galleryHtml = '\
      <div class="modal-gallery">\
        <div class="modal-gallery-img"><img src="' + img.src + '" alt="' + img.label + '"></div>\
        <div class="modal-gallery-label">' + img.label + '</div>\
        <div class="modal-gallery-dots">' + dots + '</div>\
      </div>';
  }

  return '\
    <div class="modal-backdrop" onclick="closeModal()"></div>\
    <div class="modal-panel" onclick="event.stopPropagation()">\
      <div class="modal-header">\
        <button class="modal-close" onclick="closeModal()">\u2715</button>\
        <span class="cat-badge">' + p.category + '</span>\
        <h1>' + p.title + '</h1>\
        <div class="subtitle">' + p.subtitle + '</div>\
      </div>\
      <div class="modal-body">\
        ' + galleryHtml + '\
        <div class="modal-section">\
          <div class="modal-section-label">The Challenge</div>\
          <p>' + p.problem + '</p>\
        </div>\
        <div class="modal-divider"></div>\
        <div class="modal-section">\
          <div class="modal-section-label">Our Approach</div>\
          <p>' + p.approach + '</p>\
        </div>\
        <div class="modal-divider"></div>\
        <div class="modal-section">\
          <div class="modal-section-label">What We Delivered</div>\
          ' + deliverables + '\
        </div>\
        <div class="modal-divider"></div>\
        <div class="modal-section">\
          <div class="modal-section-label">Technologies &amp; Methods</div>\
          <div>' + techTags + '</div>\
        </div>\
      </div>\
    </div>';
}

// ============ NAVIGATION ============
function navigate(page) {
  state.page = page;
  state.modal = null;
  state.galleryIdx = 0;
  window.scrollTo({ top: 0, behavior: "smooth" });
  window.location.hash = page === "home" ? "" : page;
  render();
}

function openModal(id) {
  state.modal = PROJECTS.find(function(p) { return p.id === id; });
  state.galleryIdx = 0;
  document.body.style.overflow = "hidden";
  render();
}

function closeModal() {
  state.modal = null;
  document.body.style.overflow = "";
  render();
}

function setGallery(idx) {
  state.galleryIdx = idx;
  render();
}

// Escape key to close modal
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape" && state.modal) closeModal();
});

// Handle browser back/forward
window.addEventListener("hashchange", function() {
  var hash = window.location.hash.slice(1);
  if (hash === "case-studies") {
    state.page = "case-studies";
    state.modal = null;
  } else {
    state.page = "home";
    state.modal = null;
  }
  state.galleryIdx = 0;
  document.body.style.overflow = "";
  render();
});

// Initial route
var initHash = window.location.hash.slice(1);
if (initHash === "case-studies") {
  state.page = "case-studies";
} else {
  state.page = "home";
}

render();
</script>
