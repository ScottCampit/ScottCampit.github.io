<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DB8749"/>
      <stop offset="50%" style="stop-color:#e8956a"/>
      <stop offset="100%" style="stop-color:#DB8749"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#5A7FA0" stroke-width="0.5">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>
  <!-- Voice waveform bars -->
  <g filter="url(#glow)" opacity="0.9">
    <rect x="140" y="170" width="8" height="60" rx="4" fill="url(#wave)"/>
    <rect x="160" y="140" width="8" height="120" rx="4" fill="url(#wave)"/>
    <rect x="180" y="110" width="8" height="180" rx="4" fill="url(#wave)"/>
    <rect x="200" y="150" width="8" height="100" rx="4" fill="url(#wave)"/>
    <rect x="220" y="80" width="8" height="240" rx="4" fill="url(#wave)"/>
    <rect x="240" y="130" width="8" height="140" rx="4" fill="url(#wave)"/>
    <rect x="260" y="100" width="8" height="200" rx="4" fill="url(#wave)"/>
    <rect x="280" y="60" width="8" height="280" rx="4" fill="url(#wave)"/>
    <rect x="300" y="120" width="8" height="160" rx="4" fill="url(#wave)"/>
    <rect x="320" y="90" width="8" height="220" rx="4" fill="url(#wave)"/>
    <rect x="340" y="140" width="8" height="120" rx="4" fill="url(#wave)"/>
    <rect x="360" y="70" width="8" height="260" rx="4" fill="url(#wave)"/>
    <rect x="380" y="130" width="8" height="140" rx="4" fill="url(#wave)"/>
    <rect x="400" y="100" width="8" height="200" rx="4" fill="url(#wave)"/>
    <rect x="420" y="150" width="8" height="100" rx="4" fill="url(#wave)"/>
    <rect x="440" y="120" width="8" height="160" rx="4" fill="url(#wave)"/>
    <rect x="460" y="160" width="8" height="80" rx="4" fill="url(#wave)"/>
  </g>
  <!-- Shield icon (security theme) -->
  <g transform="translate(300, 200)" opacity="0.12">
    <path d="M0-80 C40-80 70-60 70-20 C70 30 40 70 0 90 C-40 70 -70 30 -70-20 C-70-60 -40-80 0-80Z" fill="#5A7FA0" stroke="#5A7FA0" stroke-width="2"/>
  </g>
</svg>